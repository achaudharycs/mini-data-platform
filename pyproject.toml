[project]
name = "mini-data-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apache-airflow>=3.1.2",
    "anthropic>=0.40.0",
    "dbt-duckdb>=1.10.0",
    "duckdb>=1.4.1",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.scripts]
agent = "agent.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
